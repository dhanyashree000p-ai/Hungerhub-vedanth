<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">Hunger<span>Hub</span></a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="how-it-works.html">How It Works</a></li>
      <li><a href="donate.html">Donate</a></li>
      <li><a href="tracking.html">Track</a></li>
      <li><a href="collectors.html">Collectors</a></li>

    </ul>
    <div class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<section class="auth-section">
  <div class="container auth-narrow">

    <div class="auth-card">
      <h1>Create an account</h1>
      <p class="auth-sub">Register as a donor or a collector.</p>

      <form id="registerForm" class="hh-form" novalidate>

        <div class="form-group">
          <label for="regName">Full Name</label>
          <input type="text" id="regName" name="regName" required>
        </div>

        <div class="form-group">
          <label for="regMobile">Mobile Number</label>
          <input type="tel" id="regMobile" name="regMobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label for="regCountry">Country</label>
          <select id="regCountry" name="regCountry" required>
            <option value="" disabled selected>Select country</option>
            <option value="IN">India</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" name="regPassword" minlength="6" required>
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" name="regConfirmPassword" minlength="6" required>
        </div>

        <div class="form-group">
          <label>User Type</label>
          <div class="radio-row">
            <label class="radio-inline">
              <input type="radio" name="userType" value="donor" required> Donor
            </label>
            <label class="radio-inline">
              <input type="radio" name="userType" value="collector"> Collector
            </label>
          </div>
        </div>

        <div id="registerError" class="form-error" hidden></div>

        <button type="submit" class="btn-primary btn-block">Register</button>
      </form>

      <p class="auth-switch">
        Already have an account? <a href="login.html">Log in here</a>
      </p>
    </div>

  </div>
</section>

<footer class="footer">
  <div class="container footer-content">
    <p>&copy; 2026 Hunger Hub. Built for a hunger-free, waste-free city.</p>
  </div>
</footer>

<script src="../firebase/firebase-config.js" type="module"></script>

</body>
</html>
