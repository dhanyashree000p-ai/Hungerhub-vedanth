<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Hunger Hub</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/navbar.css">
<link rel="stylesheet" href="../css/forms.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-container">
    <a href="../index.html" class="nav-logo">Hunger<span>Hub</span></a>
    <ul class="nav-links">
      <li><a href="../index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="how-it-works.html">How It Works</a></li>
      <li><a href="donate.html">Donate</a></li>
      <li><a href="tracking.html">Track</a></li>
      <li><a href="collectors.html">Collectors</a></li>
      <li><a href="login.html" class="nav-btn active">Login</a></li>
    </ul>
    <div class="nav-toggle" id="navToggle">
      <span></span><span></span><span></span>
    </div>
  </div>
</nav>

<section class="auth-section">
  <div class="container auth-narrow">

    <div class="auth-card">
      <h1>Log in</h1>
      <p class="auth-sub">Use your registered mobile number and password.</p>

      <form id="loginForm" class="hh-form" novalidate>

        <div class="form-group">
          <label for="loginMobile">Mobile Number</label>
          <input type="tel" id="loginMobile" name="loginMobile" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="loginPassword" required>
        </div>

        <div id="loginError" class="form-error" hidden></div>

        <button type="submit" class="btn-primary btn-block">Log In</button>
      </form>

      <p class="auth-switch">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>

  </div>
</section>

<footer class="footer">
  <div class="container footer-content">
    <p>&copy; 2026 Hunger Hub. Built for a hunger-free, waste-free city.</p>
  </div>
</footer>

<script src="../firebase/firebase-config.js" type="module"></script>
<script src="../js/auth.js" type="module"></script>
<script src="../js/app.js"></script>
</body>
</html>
