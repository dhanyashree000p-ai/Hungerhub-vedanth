<header class="form-hero">
  <div class="container">
    <h1>Donate surplus food</h1>
    <p>Fill in the details below so the nearest box can list it right away.</p>
  </div>
</header>

<section class="form-section">
  <div class="container form-narrow">

    <form id="donateForm" class="hh-form" novalidate>

      <div class="form-group">
        <label for="foodName">Food Name</label>
        <input type="text" id="foodName" name="foodName" placeholder="e.g. Vegetable Pulao" required>
      </div>

      <div class="form-group">
        <label for="foodCategory">Food Category</label>
        <select id="foodCategory" name="foodCategory" required>
          <option value="" disabled selected>Select category</option>
          <option value="cooked">Cooked Meal</option>
          <option value="bakery">Bakery</option>
          <option value="fruits">Fruits & Vegetables</option>
          <option value="packaged">Packaged Food</option>
          <option value="dairy">Dairy</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Veg or Non-Veg</label>
        <div class="radio-row">
          <label class="radio-inline">
            <input type="radio" name="foodType" value="veg" required> Veg
          </label>
          <label class="radio-inline">
            <input type="radio" name="foodType" value="non-veg"> Non-Veg
          </label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input type="text" id="quantity" name="quantity" placeholder="e.g. 5 kg / 20 plates" required>
        </div>

        <div class="form-group">
          <label for="prepTime">Preparation Time</label>
          <input type="datetime-local" id="prepTime" name="prepTime" required>
        </div>
      </div>

      <div class="form-group">
        <label for="expiryTime">Expiry Time</label>
        <input type="datetime-local" id="expiryTime" name="expiryTime" required>
      </div>

      <div class="form-group">
        <label for="foodImage">Food Image</label>
        <input type="file" id="foodImage" name="foodImage" accept="image/*" required>
        <img id="imagePreview" class="image-preview" alt="" hidden>
      </div>

      <div class="form-group">
        <label for="boxLocation">Box Location</label>
        <select id="boxLocation" name="boxLocation" required>
          <option value="" disabled selected>Select nearest box</option>
        </select>
        <small class="field-hint">List is populated from live box data.</small>
      </div>

      <div class="form-group disclaimer-group">
        <label class="checkbox-inline">
          <input type="checkbox" id="disclaimer" name="disclaimer" required>
          I confirm this food is safe for consumption and I am responsible for its quality.
        </label>
      </div>

      <div id="formError" class="form-error" hidden></div>

      <button type="submit" class="btn-primary btn-block">Submit Donation</button>

    </form>

  </div>
</section>

  </div>
